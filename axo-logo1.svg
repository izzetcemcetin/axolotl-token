<svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 32 32">
<defs>
  <radialGradient id="bg" cx="50%" cy="40%" r="70%">
    <stop offset="0%" stop-color="#24102f"/>
    <stop offset="100%" stop-color="#050308"/>
  </radialGradient>

  <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0%" stop-color="#f19cff"/>
    <stop offset="50%" stop-color="#a93cff"/>
    <stop offset="100%" stop-color="#6410a8"/>
  </linearGradient>

  <linearGradient id="silver" x1="0" y1="0" x2="0" y2="1">
    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="45%" stop-color="#d8c9df"/>
    <stop offset="100%" stop-color="#8c7899"/>
  </linearGradient>
</defs>

<!-- Coin -->
<circle cx="16" cy="16" r="15" fill="url(#bg)" stroke="#d56cff" stroke-width="1.2"/>
<circle cx="16" cy="16" r="13.7" fill="none" stroke="#7e28bd" stroke-width=".5"/>

<!-- Axolotl gills -->
<g stroke="url(#purple)" stroke-width="1.7" stroke-linecap="round">
  <path d="M10 9 L6 5"/>
  <path d="M9 11 L4 9"/>
  <path d="M9 13 L4 13"/>
  <path d="M22 9 L26 5"/>
  <path d="M23 11 L28 9"/>
  <path d="M23 13 L28 13"/>
</g>

<!-- Axolotl head -->
<ellipse cx="16" cy="12" rx="7" ry="5.5"
         fill="#ead7ed" stroke="#bd61df" stroke-width=".7"/>

<!-- Eyes -->
<circle cx="13" cy="11" r="1.25" fill="#09050d" stroke="#b54cff" stroke-width=".4"/>
<circle cx="19" cy="11" r="1.25" fill="#09050d" stroke="#b54cff" stroke-width=".4"/>
<circle cx="12.7" cy="10.7" r=".35" fill="white"/>
<circle cx="18.7" cy="10.7" r=".35" fill="white"/>

<!-- Smile -->
<path d="M13 14 Q16 16 19 14"
      fill="none" stroke="#54214f" stroke-width=".7"
      stroke-linecap="round"/>

<!-- AXO -->
<text x="16" y="23"
      text-anchor="middle"
      font-family="Arial, Helvetica, sans-serif"
      font-size="7.3"
      font-weight="900"
      letter-spacing="-.5"
      fill="url(#silver)"
      stroke="#9c39d0"
      stroke-width=".25">AXO</text>

<!-- Polygon style symbol -->
<path d="M13.5 26.5 L15 25.6 L16.5 26.5 L16.5 28.1 L15 29 L13.5 28.1 Z
         M16.5 27.2 L18 26.3 L19.5 27.2 L19.5 28.8 L18 29.7 L16.5 28.8"
      fill="none" stroke="#a843e1" stroke-width=".55"/>
</svg>
