<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Axolotl Token (AXO) | Polygon</title>
<meta name="description" content="Official website of Axolotl Token (AXO), an ERC-20 token on the Polygon network.">

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  font-family: Arial, sans-serif;
  background: #07050d;
  color: white;
  line-height: 1.6;
}

header {
  padding: 22px 8%;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 1px solid #34204d;
}

.logo {
  font-size: 25px;
  font-weight: bold;
  color: #d88cff;
}

nav a {
  color: #ddd;
  margin-left: 22px;
  text-decoration: none;
}

.hero {
  min-height: 70vh;
  display: flex;
  flex-direction: column;
  justify-content: center;
  align-items: center;
  text-align: center;
  padding: 60px 20px;
  background:
    radial-gradient(circle at center, #351052 0%, #12091d 45%, #07050d 75%);
}

.hero h1 {
  font-size: clamp(48px, 9vw, 90px);
  color: #e39aff;
  letter-spacing: 3px;
}

.hero h2 {
  font-size: 25px;
  margin-bottom: 20px;
}

.hero p {
  max-width: 720px;
  color: #c9c3d0;
  font-size: 18px;
}

.buttons {
  margin-top: 32px;
}

.button {
  display: inline-block;
  padding: 14px 25px;
  margin: 7px;
  border-radius: 10px;
  text-decoration: none;
  font-weight: bold;
  background: #a64cff;
  color: white;
}

.button.secondary {
  background: transparent;
  border: 1px solid #a64cff;
}

section {
  max-width: 1000px;
  margin: auto;
  padding: 70px 20px;
}

h3 {
  font-size: 32px;
  margin-bottom: 22px;
  color: #d88cff;
}

.card {
  background: #110b18;
  border: 1px solid #332040;
  border-radius: 15px;
  padding: 25px;
  margin-top: 20px;
}

.contract {
  word-break: break-all;
  font-family: monospace;
  color: #e6c4ff;
}

.tokenomics {
  display: grid;
  grid-template-columns: repeat(auto-fit,minmax(200px,1fr));
  gap: 15px;
}

.tokenomics div {
  background: #110b18;
  border: 1px solid #332040;
  padding: 25px;
  border-radius: 15px;
  text-align: center;
}

.tokenomics strong {
  display: block;
  color: #d88cff;
  font-size: 22px;
}
